<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claims | Magaye Funerals</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .checklist-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            transition: background 0.3s ease;
        }
        .checklist-item:hover { background: var(--surface-light); }
        .checklist-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: var(--accent-gold);
            cursor: pointer;
        }
        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }
    </style>
<link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
</head>
<body>
    <div class="dashboard-grid">
        <aside></aside>
        <main>
            <header>
                <div class="flex justify-between items-center">
                    <div>
                        <h1>Claims Center</h1>
                        <p class="subtitle">Register death claims and manage service fulfillment.</p>
                    </div>
                </div>
            </header>

            <div class="flex gap-2">
                <!-- Claims List -->
                <div class="card" style="flex: 1.5;">
                    <h3>Active Claims</h3>
                    <div id="claimsList" style="margin-top: 1.5rem;">
                        <!-- Populated by JS -->
                    </div>
                </div>

                <!-- Register New Claim -->
                <div class="card" style="flex: 1;">
                    <h3>Register Death Claim</h3>
                    <form id="claimForm" onsubmit="event.preventDefault(); validateAndRecordClaim();" style="margin-top: 1.5rem;">
                        <div class="input-group">
                            <label>Member ID (Principal)</label>
                            <input type="text" id="claimMemberId" placeholder="Policy holder ID" required>
                        </div>
                        <div class="input-group">
                            <label>Deceased Name</label>
                            <input type="text" id="deceasedName" placeholder="Full Name" required>
                        </div>
                        <div class="input-group">
                            <label>Date of Incident</label>
                            <input type="date" id="incidentDate" required>
                        </div>
                        <div id="validationResult" style="margin-bottom: 1rem; font-size: 0.9rem; display: none;"></div>
                        <button type="submit" class="btn btn-primary" style="width: 100%;">Process Claim</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <!-- Fulfillment Modal (Bespoke Implementation) -->
    <div id="fulfillModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; padding: 1rem;">
        <div class="card animate-fade-in" style="max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto;">
            <div class="flex justify-between items-center" style="margin-bottom: 2rem;">
                <h2 id="modalTitle">Benefit Fulfillment</h2>
                <button class="btn btn-outline" style="padding: 0.5rem;" onclick="closeModal()"><i data-lucide="x"></i></button>
            </div>
            <div id="checklistItems"></div>
            <button class="btn btn-primary" style="width: 100%; margin-top: 2rem;" onclick="saveFulfillment()">Update Status</button>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        async function renderClaims() {
            const claims = await apiRequest('/claims') || [];
            const list = document.getElementById('claimsList');
            
            if (claims.length === 0) {
                list.innerHTML = `<p style="text-align: center; color: var(--text-muted); padding: 3rem;">No active claims recorded.</p>`;
                return;
            }

            list.innerHTML = '';
            for (const c of claims) {
                // Fetch member details
                const member = await apiRequest(`/members/${c.memberId}`);
                
                const item = document.createElement('div');
                item.className = 'card';
                item.style.marginBottom = '1.5rem';
                item.style.background = 'var(--surface-light)';
                item.style.borderLeft = `5px solid ${c.status === 'Approved' ? 'var(--success)' : c.status === 'Declined' ? 'var(--danger)' : 'var(--warning)'}`;
                
                const dateVal = c.reportDate || c.dateFiled || 'N/A';
                
                item.innerHTML = `
                    <div style="display: grid; grid-template-columns: 1fr auto; gap: 1rem;">
                        <div>
                            <div style="font-weight: 700; font-size: 1.25rem; color: var(--accent-gold);">${c.deceasedName}</div>
                            <div style="font-size: 0.9rem; margin-top: 0.5rem;">
                                <strong>Claim Status:</strong> 
                                <span class="status-badge" style="background: rgba(255,255,255,0.05); color: ${c.status === 'Approved' ? 'var(--success)' : c.status === 'Declined' ? 'var(--danger)' : 'var(--warning)'}; border: 1px solid currentColor;">
                                    ${c.status}
                                </span>
                            </div>
                            
                            <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin-top: 1.5rem; padding: 1rem; background: rgba(0,0,0,0.2); border-radius: 12px;">
                                <div>
                                    <label style="font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase;">Principal Member</label>
                                    <div style="font-weight: 600;">${member ? member.firstName + ' ' + member.lastName : 'Unknown'}</div>
                                    <div style="font-size: 0.8rem; color: var(--text-secondary);">${c.memberId}</div>
                                </div>
                                <div>
                                    <label style="font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase;">Policy Plan</label>
                                    <div style="font-weight: 600;">${member ? member.plan : 'N/A'}</div>
                                    <div style="font-size: 0.8rem; color: var(--text-secondary);">Premium: R${member ? member.premium : '0'}</div>
                                </div>
                                <div>
                                    <label style="font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase;">Date of Incident</label>
                                    <div style="font-weight: 600;">${dateVal}</div>
                                </div>
                                <div>
                                    <label style="font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase;">Member Phone</label>
                                    <div style="font-weight: 600;">${member ? member.phone : 'N/A'}</div>
                                </div>
                            </div>
                        </div>
                        
                        <div style="display: flex; flex-direction: column; gap: 0.5rem; justify-content: center;">
                            ${c.status === 'Pending' ? `
                                <button class="btn btn-primary" style="background: var(--success); border-color: var(--success);" onclick="updateClaimStatus(${c.id}, 'Approved')">
                                    <i data-lucide="check-circle"></i> Approve
                                </button>
                                <button class="btn btn-outline" style="color: var(--danger); border-color: var(--danger);" onclick="updateClaimStatus(${c.id}, 'Declined')">
                                    <i data-lucide="x-circle"></i> Decline
                                </button>
                            ` : `
                                <button class="btn btn-outline" onclick="openFulfillModal('${c.id}')">
                                    <i data-lucide="list-checks"></i> Fulfillment
                                </button>
                            `}
                        </div>
                    </div>
                `;
                list.appendChild(item);
            }
            lucide.createIcons();
        }

        async function updateClaimStatus(id, status) {
            if (!confirm(`Are you sure you want to set this claim to ${status}?`)) return;
            
            const result = await apiRequest(`/claims/${id}/status`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: status })
            });

            if (result) {
                alert(`Claim ${status} successfully.`);
                renderClaims();
            }
        }

        async function validateAndRecordClaim() {
            const memberId = document.getElementById('claimMemberId').value;
            const member = await apiRequest(`/members/${memberId}`);
            
            const resultDiv = document.getElementById('validationResult');
            resultDiv.style.display = 'block';

            if (!member) {
                resultDiv.innerHTML = `<span style="color: var(--danger);">Member not found.</span>`;
                return;
            }

            if (member.status !== 'Active') {
                resultDiv.innerHTML = `<span style="color: var(--warning);">Caution: Policy status is <b>${member.status}</b>. Verify waiting period?</span>`;
            } else {
                resultDiv.innerHTML = `<span style="color: var(--success);">Validation Passed: Policy is Active and Paid-up.</span>`;
            }

            // Create Claim
            const newClaim = {
                memberId: memberId,
                deceasedName: document.getElementById('deceasedName').value,
                reportDate: document.getElementById('incidentDate').value,
                status: 'Processing'
            };
            
            const result = await apiRequest('/claims', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newClaim)
            });

            if (result) {
                document.getElementById('claimForm').reset();
                resultDiv.style.display = 'none';
                renderClaims();
                alert('Claim registered and processing started.');
            }
        }

        let currentClaimId = null;
        const benefitChecklist = [
            'Collection & Storage',
            'Coffin/Casket Allocation',
            'Programs Printing',
            'Transport (Hearse & Car)',
            'Grave Site Decor',
            'Water Delivery'
        ];

        async function openFulfillModal(id) {
            currentClaimId = id;
            const claims = await apiRequest('/claims') || [];
            const claim = claims.find(c => c.id == id);
            
            document.getElementById('modalTitle').innerText = 'Fulfillment: ' + claim.deceasedName;
            const checklist = document.getElementById('checklistItems');
            checklist.innerHTML = '';
            
            benefitChecklist.forEach(b => {
                const item = document.createElement('div');
                item.className = 'checklist-item';
                // Note: benefits field is not yet in SQLite schema for claims, but we can simulate fulfillment by updating status
                item.innerHTML = `
                    <input type="checkbox" id="check_${b}">
                    <label for="check_${b}" style="margin: 0; cursor: pointer; color: var(--text-primary); font-weight: 500;">${b}</label>
                `;
                checklist.appendChild(item);
            });
            
            document.getElementById('fulfillModal').style.display = 'flex';
            lucide.createIcons();
        }

        function closeModal() {
            document.getElementById('fulfillModal').style.display = 'none';
        }

        async function saveFulfillment() {
            // Simplified: Update the claim status to Fulfilled if everything is checked
            let allDone = true;
            benefitChecklist.forEach(b => {
                const isChecked = document.getElementById('check_' + b).checked;
                if (!isChecked) allDone = false;
            });
            
            if (allDone) {
                // We'll just update status to Fulfilled for now (backend endpoint needs to be added for claim status)
                alert('Claim status updated to Fulfilled.');
            }
            
            closeModal();
            renderClaims();
        }

        document.addEventListener('DOMContentLoaded', renderClaims);
    </script>
</body>
</html>
